<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradient for envelope -->
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for shield -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d946ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a21caf;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for background circle -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Envelope body -->
  <path d="M 40 60 L 160 60 L 160 140 L 40 140 Z" fill="url(#envGrad)" rx="4"/>
  
  <!-- Envelope flap -->
  <path d="M 40 60 L 100 100 L 160 60" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Letter inside envelope -->
  <rect x="55" y="75" width="90" height="50" rx="3" fill="white" opacity="0.95"/>
  
  <!-- Text lines on letter -->
  <rect x="65" y="85" width="40" height="4" rx="2" fill="#0ea5e9"/>
  <rect x="65" y="93" width="55" height="4" rx="2" fill="#94a3b8"/>
  <rect x="65" y="101" width="45" height="4" rx="2" fill="#d946ef"/>
  <rect x="65" y="109" width="50" height="4" rx="2" fill="#38bdf8"/>
  
  <!-- Shield overlay (security/detection) -->
  <path d="M 130 100 L 145 105 L 145 125 L 130 135 L 115 125 L 115 105 Z" fill="url(#shieldGrad)" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Checkmark in shield -->
  <path d="M 125 115 L 130 120 L 138 110" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- AI Sparkles -->
  <path d="M 35 40 L 38 45 L 43 42 L 38 47 L 43 50 L 35 47 L 27 50 L 32 47 L 27 42 L 32 45 Z" fill="#fbbf24" filter="url(#glow)"/>
  <path d="M 165 35 L 167 38 L 170 36 L 167 39 L 170 41 L 165 39 L 160 41 L 163 39 L 160 36 L 163 38 Z" fill="#f0abfc" filter="url(#glow)"/>
  <path d="M 170 70 L 172 73 L 175 71 L 172 74 L 175 76 L 170 74 L 165 76 L 168 74 L 165 71 L 168 73 Z" fill="#7dd3fc" filter="url(#glow)"/>
  <path d="M 25 80 L 27 83 L 30 81 L 27 84 L 30 86 L 25 84 L 20 86 L 23 84 L 20 81 L 23 83 Z" fill="#fbbf24" filter="url(#glow)"/>
  
  <!-- Small dots decoration -->
  <circle cx="25" cy="120" r="2" fill="#0ea5e9" opacity="0.6"/>
  <circle cx="175" cy="130" r="2" fill="#d946ef" opacity="0.6"/>
  <circle cx="30" cy="150" r="1.5" fill="#38bdf8" opacity="0.4"/>
  <circle cx="170" cy="160" r="1.5" fill="#f0abfc" opacity="0.4"/>
</svg>